name: PrintVault
options:
  bundleIdPrefix: com.printvault
  deploymentTarget:
    macOS: "15.0"
  defaultConfig: Debug

targets:
  PrintVault:
    type: application
    platform: macOS
    sources:
      - Sources/PrintVault
    settings:
      base:
        SWIFT_VERSION: "6.0"
        ENABLE_PREVIEWS: "YES"
        INFOPLIST_FILE: Sources/PrintVault/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.printvault.PrintVault
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
      configs:
        Debug:
          OTHER_SWIFT_FLAGS: -DDEBUG
    entitlements:
      path: Sources/PrintVault/App/PrintVault.entitlements
      properties:
        com.apple.security.app-sandbox: false
  PrintVaultTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/PrintVaultTests
    dependencies:
      - target: PrintVault
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.printvault.PrintVaultTests
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"

configs:
  Debug:
    type: debug
  Release:
    type: release
